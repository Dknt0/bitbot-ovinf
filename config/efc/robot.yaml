      l_hip_y: 3.0
      l_knee: 3.0
      l_ankle_p: 2.0
      l_ankle_r: 2.0
      r_hip_p: 3.0
      r_hip_r: 3.0
      r_hip_y: 3.0
      r_knee: 3.0
      r_ankle_p: 2.0
      r_ankle_r: 2.0
      waist_y: 3.0
      l_shoulder_p: 2.0
      l_shoulder_r: 2.0
      l_shoulder_y: 2.0
      l_elbow_p: 2.0
      l_elbow_y: 2.0
      r_shoulder_p: 2.0
      r_shoulder_r: 2.0
      r_shoulder_y: 2.0
      r_elbow_p: 2.0
      r_elbow_y: 2.0
      head_y: 2.0
    default_position: *defult_init_pos
    decimation: 10
    target_pos_filter: *default_target_pos_filter

    inference:
      policy_type: "Epsilon"
      use_absolute_clock: true
      control_period: 0.01
      # model_path: "/home/dknt/Project/bitbot-ovinf/checkpoint/efc/theta_10.onnx"
      # model_path: "/home/dknt/Project/bitbot-ovinf/checkpoint/efc/theta_3d_v3.onnx"
      model_path: "/home/dknt/Project/bitbot-ovinf/checkpoint/efc/theta_3d_v2.onnx"
      obs_buffer_size: 15

      log_data: true
