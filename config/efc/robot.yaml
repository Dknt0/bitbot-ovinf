        l_shoulder_r: 0.1
        l_shoulder_y: 0
        l_elbow_p: -0.8
        l_elbow_y: 0
        r_shoulder_p: 0.3
        r_shoulder_r: -0.1
        r_shoulder_y: 0
        r_elbow_p: -0.8
        r_elbow_y: 0
        head_y: 0

